<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meu Portfólio</title>

  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Seu CSS (precisa vir DEPOIS do Bootstrap) -->
  <link rel="stylesheet" href="css/custom.css">
</head>
<body>

  <!-- TÓPICO 3: NAVBAR FIXA COM LINKS PARA AS SEÇÕES -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
    <div class="container">
      <a class="navbar-brand" href="#inicio">Meu Portfólio</a>

      <button class="navbar-toggler" type="button"
              data-bs-toggle="collapse" data-bs-target="#menu"
              aria-controls="menu" aria-expanded="false"
              aria-label="Abrir menu de navegação">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="menu">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="#inicio">Início</a></li>
          <li class="nav-item"><a class="nav-link" href="#sobre">Sobre</a></li>
          <li class="nav-item"><a class="nav-link" href="#servicos">Serviços</a></li>
          <li class="nav-item"><a class="nav-link" href="#contato">Contato</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- TÓPICO 4: HERO SECTION (também é a seção #inicio) -->
  <header id="inicio"
          class="bg-primary text-white text-center d-flex flex-column justify-content-center align-items-center"
          style="min-height:80vh;">
    <div class="container">
      <h1 class="display-3 fw-bold">Olá, eu sou o Gabriel Silva</h1>
      <p class="lead mb-4">Transformo ideias em experiências digitais responsivas</p>

      <div class="d-flex gap-3 justify-content-center">
        <!-- Botão primário: ação principal -->
        <a href="#servicos" class="btn btn-light btn-lg">
          Saiba mais
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor"
               viewBox="0 0 16 16" aria-hidden="true" class="ms-1">
            <path fill-rule="evenodd" d="M1 8a.5.5 0 0 1 .5-.5h11.793l-3.147-3.146a.5.5 0 0 1 .708-.708l4 4a.5.5 0 0 1 0 .708l-4 4a.5.5 0 0 1-.708-.708L13.293 8.5H1.5A.5.5 0 0 1 1 8z"/>
          </svg>
        </a>
        <!-- Botão secundário: outline -->
        <a href="#contato" class="btn btn-outline-light btn-lg">Fale comigo</a>
      </div>
    </div>
  </header>

  <!-- SOBRE -->
  <section id="sobre" class="py-5">
    <div class="container">
      <h2>Sobre</h2>
      <p>Conteúdo da seção sobre será criado depois.</p>
    </div>
  </section>

  <!-- SERVIÇOS -->
  <section id="servicos" class="py-5 bg-light">
    <div class="container">
      <h2>Serviços</h2>
      <p>Conteúdo da seção de serviços será criado depois.</p>
    </div>
  </section>

  <!-- CONTATO -->
  <section id="contato" class="py-5">
    <div class="container">
      <h2>Contato</h2>
    </div>
  </section>

  <!-- Bootstrap JS (necessário para o menu ☰ no celular) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Fecha o menu mobile ao clicar em um link -->
  <script>
    const menu = document.getElementById('menu');
    document.querySelectorAll('#menu .nav-link').forEach(link => {
      link.addEventListener('click', () => {
        if (menu.classList.contains('show')) {
          bootstrap.Collapse.getOrCreateInstance(menu).hide();
        }
      });
    });
  </script>

</body>
</html>
