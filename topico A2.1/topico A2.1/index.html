
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Responsivo</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="dashboard">

    <aside class="sidebar">
      <h2>Meu Dashboard</h2>
      <nav>
        <a href="#">🏠 Início</a>
        <a href="#">📊 Relatórios</a>
        <a href="#">👥 Usuários</a>
        <a href="#">⚙️ Configurações</a>
      </nav>
    </aside>

    <main class="content">

      <header>
        <h1>Painel de Controle</h1>
        <p>Bem-vindo ao seu dashboard!</p>
      </header>

      <section class="cards">
        <div class="card">
          <h3>Vendas</h3>
          <p>R$ 15.000</p>
        </div>

        <div class="card">
          <h3>Usuários</h3>
          <p>1.250</p>
        </div>

        <div class="card">
          <h3>Pedidos</h3>
          <p>320</p>
        </div>
      </section>

      <section class="chart">
        <h2>Gráfico de Vendas</h2>

        <div class="bars">
          <div style="height: 40%"></div>
          <div style="height: 70%"></div>
          <div style="height: 50%"></div>
          <div style="height: 90%"></div>
          <div style="height: 60%"></div>
          <div style="height: 80%"></div>
        </div>
      </section>

      <footer>
        Dashboard Responsivo - 2026
      </footer>

    </main>
  </div>

</body>
</html>
