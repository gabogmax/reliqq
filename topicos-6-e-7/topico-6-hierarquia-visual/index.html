<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tópico 6 - Hierarquia Visual (Card de Produto)</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <article class="card">

    <div class="card-img">
      <span class="tag">-40% OFF</span>
      <svg viewBox="0 0 200 160" role="img" aria-label="Ilustração de uma jaqueta jeans">
        <rect width="200" height="160" fill="#eaf2ff"/>
        <path d="M60 30 L80 22 L100 34 L120 22 L140 30 L168 62 L148 78 L140 68 L140 134 L60 134 L60 68 L52 78 L32 62 Z" fill="#3742fa"/>
        <path d="M100 34 L100 134" stroke="#fff" stroke-width="3"/>
        <circle cx="80" cy="84" r="6" fill="#ff4757"/>
      </svg>
    </div>

    <div class="card-body">
      <p class="categoria">Jaquetas customizadas</p>
      <h1>Jaqueta Jeans com Patches</h1>

      <p class="avaliacao" aria-label="Nota 4,8 de 5">★★★★★ <span>4,8 (126 avaliações)</span></p>

      <p class="preco">R$ 239<span class="centavos">,90</span>
        <span class="preco-antigo">R$ 399,90</span>
      </p>
      <p class="parcela">ou 6x de R$ 39,98 sem juros</p>

      <p class="descricao">Peça única, feita à mão, com patches e bordados. Tecido resistente e caimento cropped.</p>

      <button class="btn-principal">Comprar agora</button>
      <a class="btn-secundario" href="#">Adicionar aos favoritos</a>
    </div>

  </article>
</body>
</html>
